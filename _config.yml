title: KongFayth.top
subtitle: ''
description: '斯是陋室，惟吾德馨'
keywords:
author: Fayth Kong
language: en
timezone: ''
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set  false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set  false to remove trailing '.html' from permalinks
# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

url: https://kongfayth.top

aplayer:
  enable: true
  meting: true
  asset_inject: false

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

#时间格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 8
pagination_dir: page
#Algolia搜索API配置
# algolia 搜索
algolia_search:
  enable: true
  hits:
    per_page: 10

# 本地搜索
local_search:
  enable: false
algolia:
  applicationID: 'SNTMR4N3PL'
  apiKey: 'b249434b07de1160882e7c9fa6efc02b'
  indexName: 'Hexo'
  chunkSize: 50
#评论
comments:
  enable: false
  type: "valine"
  appId: 'JiW7dShyDQzTHpzDuANrk1LJ-gzGzoHsz'
  appKey: 'lXEMngvtSo0pCqJCaksPl0JH'
  placeholder: '在此输入评论'
# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:
search:
  path: search.xml
  field: post
  content: true
  format: html
theme: Fan
#github上传
deploy:
  type: 'git'
  repo: https://github.com/FaythKong/FaythKong.github.io
  branch: main